<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hello Kitty Hesap Makinesi</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --pink: #ff85a2;
      --hot-pink: #ff4d8d;
      --light-pink: #ffe0eb;
      --pale: #fff5f8;
      --white: #ffffff;
      --text: #7a3a5a;
      --shadow: #f0a0bc;
      --btn-op: #ffb3cc;
      --btn-num: #ffffff;
      --btn-eq: #ff4d8d;
      --accent: #ff91b4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe0eb 0%, #ffd6e8 40%, #ffb3cc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
    }

    /* Floating stars background */
    body::before {
      content: '✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧';
      position: fixed;
      top: 0; left: 0; right: 0;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 20px;
      padding: 10px;
      animation: drift 8s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes drift {
      0% { transform: translateX(-60px); }
      100% { transform: translateX(60px); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Hello Kitty PNG */
    .kitty-head {
      width: 150px;
      height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(255,77,141,0.45));
      animation: bounce 3s ease-in-out infinite;
      cursor: pointer;
    }

    /* Sparkle container */
    .sparkle-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 1.2rem;
      animation: sparkle-pop 0.7s ease-out forwards;
    }

    @keyframes sparkle-pop {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--hot-pink);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 1px 2px 0 rgba(255,77,141,0.2);
    }

    /* Calculator */
    .calc {
      background: var(--white);
      border-radius: 28px;
      padding: 22px 20px 24px;
      box-shadow:
        0 10px 40px rgba(255,77,141,0.25),
        0 2px 0 var(--shadow),
        inset 0 1px 2px rgba(255,255,255,0.9);
      width: 300px;
      border: 2.5px solid var(--light-pink);
    }

    /* Display */
    .display {
      background: var(--pale);
      border-radius: 16px;
      padding: 14px 18px 10px;
      margin-bottom: 18px;
      border: 2px solid var(--light-pink);
      text-align: right;
      position: relative;
      overflow: hidden;
    }

    .display::before {
      content: '♡';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--accent);
      opacity: 0.6;
    }

    .display .expression {
      font-size: 0.78rem;
      color: #e0a0c0;
      min-height: 18px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .display .result {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
      line-height: 1.1;
      word-break: break-all;
    }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 16px 0;
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
      position: relative;
      outline: none;
    }

    button:active {
      transform: scale(0.93) translateY(2px);
    }

    /* Number buttons */
    .btn-num {
      background: var(--btn-num);
      color: var(--text);
      border: 2px solid var(--light-pink);
      box-shadow: 0 4px 0 var(--shadow);
    }
    .btn-num:hover { filter: brightness(0.97); }

    /* Operator buttons */
    .btn-op {
      background: var(--btn-op);
      color: var(--hot-pink);
      border: 2px solid var(--accent);
      box-shadow: 0 4px 0 #f093b4;
    }
    .btn-op:hover { filter: brightness(0.96); }

    /* Equals button */
    .btn-eq {
      background: linear-gradient(135deg, var(--hot-pink), #ff85a2);
      color: white;
      border: 2px solid var(--hot-pink);
      box-shadow: 0 4px 0 #d6306f;
      grid-column: span 2;
      font-size: 1.3rem;
    }
    .btn-eq:hover { filter: brightness(1.05); }

    /* Clear / special */
    .btn-clear {
      background: linear-gradient(135deg, #ff85a2, #ffb3cc);
      color: white;
      border: 2px solid #ff85a2;
      box-shadow: 0 4px 0 #e0608a;
    }
    .btn-clear:hover { filter: brightness(1.05); }

    .btn-zero {
      grid-column: span 2;
    }

    /* Sparkle pop on press */
    button::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.35);
      opacity: 0;
      transition: opacity 0.15s;
    }
    button:active::after { opacity: 1; }

    /* Footer */
    .footer {
      font-size: 0.72rem;
      color: var(--hot-pink);
      opacity: 0.65;
      letter-spacing: 1.5px;
      text-align: center;
    }

    /* Decorative dots */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 2px;
    }
    .dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.5;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.3s; }
    .dots span:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.4); opacity: 1; }
    }
  </style>
</head>

  <div class="title">Hello Kitty ♡</div>

  <div class="calc">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-op" onclick="toggleSign()">+/-</button>
      <button class="btn-op" onclick="percent()">%</button>
      <button class="btn-op" onclick="setOp('/')">÷</button>

      <!-- Row 2 -->
      <button class="btn-num" onclick="pressNum('7')">7</button>
      <button class="btn-num" onclick="pressNum('8')">8</button>
      <button class="btn-num" onclick="pressNum('9')">9</button>
      <button class="btn-op" onclick="setOp('*')">×</button>

      <!-- Row 3 -->
      <button class="btn-num" onclick="pressNum('4')">4</button>
      <button class="btn-num" onclick="pressNum('5')">5</button>
      <button class="btn-num" onclick="pressNum('6')">6</button>
      <button class="btn-op" onclick="setOp('-')">−</button>

      <!-- Row 4 -->
      <button class="btn-num" onclick="pressNum('1')">1</button>
      <button class="btn-num" onclick="pressNum('2')">2</button>
      <button class="btn-num" onclick="pressNum('3')">3</button>
      <button class="btn-op" onclick="setOp('+')">+</button>

      <!-- Row 5 -->
      <button class="btn-num btn-zero" onclick="pressNum('0')">0</button>
      <button class="btn-num" onclick="pressDecimal()">.</button>
      <button class="btn-eq" onclick="calculate()">♡ =</button>
    </div>
  </div>

  <div class="footer">✦ kawaii hesap makinesi ✦</div>
  <div class="dots">
    <span></span><span></span><span></span>
  </div>
</div>

<script>
  let current = '0';
  let previous = '';
  let operator = null;
  let shouldReplace = false;
  let expressionStr = '';

  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');

  function updateDisplay(val) {
    resultEl.textContent = val;
  }

  function pressNum(n) {
    playNumSound();
    if (shouldReplace) {
      current = n;
      shouldReplace = false;
    } else {
      current = current === '0' ? n : current + n;
    }
    if (current.length > 12) current = current.slice(0, 12);
    updateDisplay(current);
  }

  function pressDecimal() {
    playNumSound();
    if (shouldReplace) { current = '0.'; shouldReplace = false; }
    if (!current.includes('.')) current += '.';
    updateDisplay(current);
  }

  function setOp(op) {
    playOpSound();
    if (operator && !shouldReplace) calculate(true);
    previous = current;
    operator = op;
    shouldReplace = true;
    const opSymbol = {'+':'+', '-':'−', '*':'×', '/':'÷'}[op];
    expressionStr = previous + ' ' + opSymbol;
    expressionEl.textContent = expressionStr;
  }

  function calculate(chain = false) {
    if (!operator || !previous) return;
    if (!chain) playEqualSound();
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;
    switch(operator) {
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b !== 0 ? a / b : '♡ Hata'; break;
    }
    if (!chain) {
      expressionEl.textContent = expressionStr + ' ' + current + ' =';
      operator = null;
    }
    const display = typeof res === 'number'
      ? parseFloat(res.toFixed(10)).toString()
      : res;
    current = display;
    updateDisplay(display);
    shouldReplace = !chain;
  }

  function clearAll() {
    playClearSound();
    current = '0';
    previous = '';
    operator = null;
    shouldReplace = false;
    expressionStr = '';
    expressionEl.textContent = '';
    updateDisplay('0');
  }

  function toggleSign() {
    playOpSound();
    current = (parseFloat(current) * -1).toString();
    updateDisplay(current);
  }

  function percent() {
    playOpSound();
    current = (parseFloat(current) / 100).toString();
    updateDisplay(current);
  }

  // ── Kawaii Ses Efektleri (Web Audio API) ──────────────────────
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, type = 'sine', duration = 0.12, vol = 0.18) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.05, ctx.currentTime + duration * 0.5);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  }

  function playNumSound() {
    // Tatlı "ping" sesi - rastgele pentatonik nota
    const notes = [523, 587, 659, 784, 880, 1047];
    const freq = notes[Math.floor(Math.random() * notes.length)];
    playTone(freq, 'sine', 0.13, 0.15);
  }

  function playOpSound() {
    // Operatör: iki nota birden - küçük akor
    playTone(698, 'sine', 0.15, 0.12);
    setTimeout(() => playTone(880, 'sine', 0.12, 0.1), 40);
  }

  function playEqualSound() {
    // Eşittir: kawaii jingle üç nota
    const melody = [784, 1047, 1319];
    melody.forEach((f, i) => {
      setTimeout(() => playTone(f, 'sine', 0.2, 0.18), i * 100);
    });
  }

  function playClearSound() {
    // AC: aşağı süpürme sesi
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
  }

  function playKittySound() {
    // Gerçekçi "Nyaa~" kedi miyavlaması - frekans kayması ile
    const ac = ctx;
    const now = ac.currentTime;

    // — Ana "Nyaa" sesi —
    const osc1 = ac.createOscillator();
    const gain1 = ac.createGain();
    // Formant filtresi (burun/vokal rengi)
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.linearRampToValueAtTime(1400, now + 0.12);
    filter.Q.value = 3;

    osc1.connect(filter);
    filter.connect(gain1);
    gain1.connect(ac.destination);

    // "N" → "yaa" frekans kayması
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(320, now);           // N (kapalı)
    osc1.frequency.linearRampToValueAtTime(480, now + 0.07); // ya (açılış)
    osc1.frequency.linearRampToValueAtTime(560, now + 0.18); // aa (uzama)
    osc1.frequency.linearRampToValueAtTime(400, now + 0.38); // ~  (iniş)

    gain1.gain.setValueAtTime(0, now);
    gain1.gain.linearRampToValueAtTime(0.25, now + 0.04);
    gain1.gain.setValueAtTime(0.22, now + 0.18);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

    osc1.start(now);
    osc1.stop(now + 0.43);

    // — Tiz "kawaii" üst tını —
    const osc2 = ac.createOscillator();
    const gain2 = ac.createGain();
    osc2.connect(gain2);
    gain2.connect(ac.destination);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(960, now + 0.06);
    osc2.frequency.linearRampToValueAtTime(1120, now + 0.22);
    osc2.frequency.exponentialRampToValueAtTime(700, now + 0.42);
    gain2.gain.setValueAtTime(0, now + 0.06);
    gain2.gain.linearRampToValueAtTime(0.08, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    osc2.start(now + 0.06);
    osc2.stop(now + 0.43);
  }

  // ── Hello Kitty tıklama animasyonu ────────────────────────────
  function kittyClick() {
    playKittySound();
    const wrap = document.getElementById('kittyWrap');
    const emojis = ['✨','💕','⭐','🌸','💖','🎀','✦'];
    for (let i = 0; i < 6; i++) {
      const sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = (Math.PI * 2 / 6) * i;
      const dist = 55 + Math.random() * 30;
      sp.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      sp.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      sp.style.left = '50%';
      sp.style.top = '50%';
      wrap.appendChild(sp);
      setTimeout(() => sp.remove(), 700);
    }
  }

  
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') pressNum(e.key);
    else if (e.key === '.') pressDecimal();
    else if (e.key === '+') setOp('+');
    else if (e.key === '-') setOp('-');
    else if (e.key === '*') setOp('*');
    else if (e.key === '/') { e.preventDefault(); setOp('/'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      playNumSound();
      current = current.length > 1 ? current.slice(0, -1) : '0';
      updateDisplay(current);
    }
  });
</script>
